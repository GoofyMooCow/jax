[package]
name = "jax-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The tiny `jax` launcher: finds, installs and runs the toolchain a project pins"

[[bin]]
name = "jax"
path = "src/main.rs"

[dependencies]
jax-manifest = { path = "../jax-manifest" }
jax-toolchain = { path = "../jax-toolchain" }
