[workspace]
resolver = "2"
members = ["crates/*", "xtask"]
default-members = ["crates/jax-launcher", "crates/jax-driver", "crates/jax-rt"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/GoofyMooCow/jax"
rust-version = "1.75"

# Stage 0 policy: the whole workspace has ZERO third-party dependencies.
# That keeps the bootstrap reproducible and buildable offline.

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
